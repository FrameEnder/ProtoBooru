city=".75"/><path d="M531,156.2 C524.5,151.6 526,146.8 529,146.9 C530.1,146.9 530.7,147.6 531,148.3 C531.3,147.6 531.9,146.9 533,146.9 C536,146.8 537.5,151.6 531,156.2 Z" fill="#f0a640"/></g></g>
