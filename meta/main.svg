<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12161c"/>
      <stop offset="1" stop-color="#0e1116"/>
    </linearGradient>
    <linearGradient id="t0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0a640"/><stop offset="1" stop-color="#b85c8a"/></linearGradient><linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fa8f0"/><stop offset="1" stop-color="#86c17a"/></linearGradient><linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b394e8"/><stop offset="1" stop-color="#f48fb1"/></linearGradient><linearGradient id="t3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86c17a"/><stop offset="1" stop-color="#e6c15a"/></linearGradient><linearGradient id="t4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f48fb1"/><stop offset="1" stop-color="#6fa8f0"/></linearGradient><linearGradient id="t5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6c15a"/><stop offset="1" stop-color="#e0705f"/></linearGradient>
    <clipPath id="frame"><rect width="720" height="240" rx="18"/></clipPath>
    <style>
  text{font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
  .mono{font-family:'JetBrains Mono','Cascadia Mono',ui-monospace,Menlo,monospace;font-size:11px;fill:#8e97a4}
  .ttl{font-size:52px;font-weight:800}
  .mode{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:9.5px;letter-spacing:2px;fill:#f0a640;text-anchor:middle;opacity:.85}
  .chipt{font-size:12.5px;font-weight:600;fill:#86c17a;text-anchor:middle}
  .tagt{font-size:9px;font-weight:600;text-anchor:start}

  /* the two halves of the name slide together */
  .tl{animation:inL .75s cubic-bezier(.22,1.2,.36,1) .15s both}
  .tr{animation:inR .75s cubic-bezier(.22,1.2,.36,1) .15s both}
  @keyframes inL{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:none}}
  @keyframes inR{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
  .dash{animation:snap .5s cubic-bezier(.34,1.8,.64,1) .8s both;transform-origin:360px 58px}
  @keyframes snap{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:scale(1)}}

  /* panels rise in */
  .pl{animation:rise .6s ease-out .75s both} .pr{animation:rise .6s ease-out .9s both} .trk{animation:fade .5s ease 1.2s both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* gallery thumbnails pop in */
  .th{animation:pop .4s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}

  /* pictures travel left → right */
  .pk{opacity:0}
  .p0{animation:fly .9s cubic-bezier(.45,0,.3,1) 1.55s both} .p1{animation:fly .9s cubic-bezier(.45,0,.3,1) 1.9s both} .p2{animation:fly .9s cubic-bezier(.45,0,.3,1) 2.25s both}
  @keyframes fly{0%{opacity:0;transform:translateX(0)}12%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateX(129px)}}

  /* the post appears, then gets tagged chip by chip */
  .img{animation:pop .5s cubic-bezier(.34,1.56,.64,1) 2.45s both;transform-origin:502px 171px}
  .flash{animation:flash 1s ease 2.45s both}
  @keyframes flash{0%{opacity:.85}100%{opacity:0}}
  .g0{animation:tag .45s cubic-bezier(.34,1.7,.64,1) 2.8s both} .g1{animation:tag .45s cubic-bezier(.34,1.7,.64,1) 3.05s both}
  .g2{animation:tag .45s cubic-bezier(.34,1.7,.64,1) 3.3s both} .g3{animation:tag .45s cubic-bezier(.34,1.7,.64,1) 3.55s both}
  .g0,.g1,.g2,.g3{transform-box:fill-box;transform-origin:0 50%}
  @keyframes tag{0%{opacity:0;transform:translateX(-12px) scale(.7)}100%{opacity:1;transform:none}}

  /* favorited: heart pops, header dot goes green */
  .heart{animation:beat .6s cubic-bezier(.34,1.8,.64,1) 3.95s both;transform-origin:531px 152px}
  @keyframes beat{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.35)}100%{opacity:1;transform:scale(1)}}
  .okdot{animation:fade .4s ease 4.15s both}
  .chip{animation:snap2 .55s cubic-bezier(.34,1.56,.64,1) 4.25s both;transform-origin:360px 198px}
  @keyframes snap2{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:scale(1)}}

  /* the mascot peeks over the post panel, then blinks */
  .peek{animation:peek .7s cubic-bezier(.34,1.56,.64,1) 4.6s both}
  @keyframes peek{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
</style>
  </defs>
  <rect width="720" height="240" rx="18" fill="url(#bgGrad)"/>

  <!-- Name: "Proto" and "Booru" converge -->
  <text class="ttl tl" x="346" y="76" text-anchor="end" fill="#e8e2d4">Proto</text>
  <rect class="dash" x="351" y="54" width="18" height="7" rx="3.5" fill="#f0a640"/>
  <text class="ttl tr" x="374" y="76" text-anchor="start" fill="#f0a640">Booru</text>

  <g clip-path="url(#frame)"><g class="peek"><g transform="translate(558,50) scale(0.78)"><g transform="translate(0,0) scale(1.0)"><path d="M29,47 L31.5,23.5 Q32.5,18.5 37,21.5 L51,33 Z" fill="#FFF4E6" stroke="#2A1F2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M79,47 L76.5,23.5 Q75.5,18.5 71,21.5 L57,33 Z" fill="#FFF4E6" stroke="#2A1F2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M33.5,40 L35,27.5 Q35.6,25.2 37.6,26.6 L45,33 Z" fill="#F7A8B8"/><path d="M74.5,40 L73,27.5 Q72.4,25.2 70.4,26.6 L63,33 Z" fill="#F7A8B8"/><path d="M26.5,58 A27.5,23 0 1,0 81.5,58 A27.5,23 0 1,0 26.5,58 Z" fill="#FFF4E6" stroke="#2A1F2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M53,35.5 Q50,27 56,25.5 Q61,24.5 59,29" fill="none" stroke="#2A1F2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M37.9,57.5 A5.6,7.2 0 1,0 49.1,57.5 A5.6,7.2 0 1,0 37.9,57.5 Z" fill="#2A1F2E"/><path d="M58.9,57.5 A5.6,7.2 0 1,0 70.1,57.5 A5.6,7.2 0 1,0 58.9,57.5 Z" fill="#2A1F2E"/><path d="M39.6,60.6 A3.9,3.6 0 1,0 47.4,60.6 A3.9,3.6 0 1,0 39.6,60.6 Z" fill="#C77DFF"/><path d="M60.6,60.6 A3.9,3.6 0 1,0 68.4,60.6 A3.9,3.6 0 1,0 60.6,60.6 Z" fill="#C77DFF"/><path d="M39.4,54.6 A2.2,2.4 0 1,0 43.8,54.6 A2.2,2.4 0 1,0 39.4,54.6 Z" fill="#FFFFFF"/><path d="M60.4,54.6 A2.2,2.4 0 1,0 64.8,54.6 A2.2,2.4 0 1,0 60.4,54.6 Z" fill="#FFFFFF"/><path d="M44.6,61.8 A1,1 0 1,0 46.6,61.8 A1,1 0 1,0 44.6,61.8 Z" fill="#FFFFFF"/><path d="M65.6,61.8 A1,1 0 1,0 67.6,61.8 A1,1 0 1,0 65.6,61.8 Z" fill="#FFFFFF"/><path d="M30.6,67.2 A4.6,2.4 0 1,0 39.8,67.2 A4.6,2.4 0 1,0 30.6,67.2 Z" fill="#FF8FA8" fill-opacity="0.55"/><path d="M68.2,67.2 A4.6,2.4 0 1,0 77.4,67.2 A4.6,2.4 0 1,0 68.2,67.2 Z" fill="#FF8FA8" fill-opacity="0.55"/><path d="M49.8,66.4 Q51.9,69.6 54,66.6 Q56.1,69.6 58.2,66.4" fill="none" stroke="#2A1F2E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M77.5,30 L82,37.5" fill="none" stroke="#2A1F2E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M79.6,36.4 L86.6,36.4 L90.6,41.5 L86.6,46.6 L79.6,46.6 Q77.6,46.6 77.6,44.6 L77.6,38.4 Q77.6,36.4 79.6,36.4 Z" fill="#7DD3C0" stroke="#2A1F2E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M80.3,41.5 A1.3,1.3 0 1,0 82.9,41.5 A1.3,1.3 0 1,0 80.3,41.5 Z" fill="#2A1F2E"/></g></g></g></g>

