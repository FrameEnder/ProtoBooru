#t4)"/><circle cx="179.3" cy="181.6" r="3.2" fill="#fff" fill-opacity=".75"/><path d="M141,198 L160.3,186.0 L173.7,194.1 L182.7,189.2 L193,198 Z" fill="#0e1116" fill-opacity=".35"/></g><g class="th" style="animation-delay:1.40s;transform-origin:232px 186px"><rect x="204" y="173" width="56" height="27" rx="4" fill="url(#t5)"/><circle cx="244.3" cy="181.6" r="3.2" fill="#fff" fill-opacity=".75"/><path d="M206,198 L225.3,186.0 L238.7,194.1 L247.7,189.2 L258,198 Z" fill="#0e1116" fill-opacity=".35"/></g></g>
