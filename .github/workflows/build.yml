name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history and tags, so release notes can list every commit since the last release

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners already ship the Android SDK with licenses accepted.
      # (android-actions/setup-android@v3 breaks on cmdline-tools 16 by requesting the
      # removed legacy "tools" package, so we just add what this project needs.)
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.PB_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PB_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore found."
          else
            echo "::warning::No PB_KEYSTORE_B64 secret. The release APK will be signed with a throwaway debug key, so it cannot update a previous install."
          fi

      - name: Build release APK
        env:
          PB_KEYSTORE_PASSWORD: ${{ secrets.PB_KEYSTORE_PASSWORD }}
          PB_KEY_ALIAS: ${{ secrets.PB_KEY_ALIAS }}
          PB_KEY_PASSWORD: ${{ secrets.PB_KEY_PASSWORD }}
          PB_VERSION_CODE: ${{ github.run_number }}
          PB_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/ProtoBooru-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ProtoBooru-apk
          path: out/*.apk

      # Stable release notes: every commit since the previous v* tag (all the nightlies in between).
      - name: Write release notes (tags only)
        if: github.ref_type == 'tag'
        run: |
          TAG="$GITHUB_REF_NAME"
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          {
            if [ -n "$PREV" ]; then
              echo "## Changes since $PREV"
              RANGE="$PREV..$TAG"
            else
              echo "## Changes"
              RANGE="$TAG"
            fi
            echo
            git log --no-merges --reverse --pretty='format:- %s (%h)' "$RANGE"
            echo
            if [ -n "$PREV" ]; then
              echo
              echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$TAG"
            fi
          } > release-notes.md
          cat release-notes.md

      # Stable channel: pushing a tag like v1.2.0 publishes a normal release.
      - name: Publish GitHub release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body_path: release-notes.md

      # Nightly channel: every push to main replaces the rolling "nightly" pre-release.
      # The in-app updater reads the build number from the APK name (ProtoBooru-<run>.apk).
      - name: Publish nightly pre-release (main pushes)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          git log -1 --pretty='format:%s%n%n%b' > notes.txt
          printf '\n\nBuild ${{ github.run_number }} from %s\n' "${GITHUB_SHA::7}" >> notes.txt
          gh release create nightly out/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly #${{ github.run_number }}" \
            --notes-file notes.txt
